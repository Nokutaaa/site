<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nokuta</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f4f0;
      --sidebar-w: 210px;
      --text:      #1a1a1a;
      --text-mid:  #888;
      --text-dim:  #bbb;
      --border:    #ddd;
      --font:      'Cormorant Garamond', Georgia, serif;
      --mono:      'DM Mono', monospace;
    }

    html {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 17px;
    }

    body {
      display: flex;
      min-height: 100vh;
    }

    /* ══════════════════════════════════
       MOSAÏQUE
    ══════════════════════════════════ */
    .mosaic-wrap {
      flex: 1;
      margin-right: var(--sidebar-w);
      padding: 28px 24px 60px 28px;
      overflow-y: auto;
    }

    /*
      Grille éditoriale — 12 colonnes fines, rangées de 60px.
      Chaque tile combine colonnes ET rangées pour des proportions variées.
    */
    .mosaic {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 60px;
      gap: 5px;
    }

    .tile {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      background: #1a1a1a;
    }

    /*
      ── Placement & dimensions de chaque tile ──
      Largeur ET hauteur intentionnellement asymétriques.

      showreel : 8 col × 6 rangées  → paysage large (proche 16:9)
      t2       : 4 col × 6 rangées  → portrait
      t3       : 5 col × 4 rangées  → paysage moyen
      t4       : 3 col × 7 rangées  → portrait étroit et haut
      t5       : 4 col × 3 rangées  → quasi-carré
      t6       : 5 col × 5 rangées  → carré large
      t7       : 7 col × 3 rangées  → cinémascope
      t8       : 3 col × 5 rangées  → colonne fine
      t9       : 9 col × 4 rangées  → très large
    */
    .tile.showreel { grid-column: 1 / 9;  grid-row: 1 / 7;  }
    .tile.t2       { grid-column: 9 / 13; grid-row: 1 / 7;  }
    .tile.t3       { grid-column: 1 / 6;  grid-row: 7 / 11; }
    .tile.t4       { grid-column: 6 / 9;  grid-row: 7 / 14; }
    .tile.t5       { grid-column: 9 / 13; grid-row: 7 / 10; }
    .tile.t6       { grid-column: 9 / 13; grid-row: 10 / 14;}
    .tile.t7       { grid-column: 1 / 6;  grid-row: 11 / 14;}
    .tile.t8       { grid-column: 1 / 4;  grid-row: 14 / 19;}
    .tile.t9       { grid-column: 4 / 13; grid-row: 14 / 19;}

    /* Media — couvre toute la tile */
    .tile-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .45s ease;
    }

    /* Overlay hover */
    .tile-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      transition: background .3s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .tile:hover .tile-overlay { background: rgba(0,0,0,.25); }
    .tile:hover .tile-media   { transform: scale(1.04); }

    /* Icône play */
    .play-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.65);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .25s;
      flex-shrink: 0;
    }
    .play-icon::after {
      content: '';
      width: 0; height: 0;
      border-top:    8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left:   14px solid rgba(255,255,255,.85);
      margin-left: 3px;
    }
    .tile[data-yt]:hover .play-icon { opacity: 1; }

    /* ══════════════════════════════════
       SIDEBAR (fixe, droite)
    ══════════════════════════════════ */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-w);
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 52px 18px 28px 22px;
      border-left: none;
      background: var(--bg);
      z-index: 100;
      overflow-y: auto;
      text-align: left;
    }

    .logo-wrap {
      margin-bottom: 32px;
    }
    .logo-wrap img {
      display: block;
      width: 100%;
      max-width: 155px;
      height: auto;
    }

    .nav-section { margin-bottom: 10px; }

    .nav-cat {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .08em;
      color: var(--text);
      text-decoration: none;
      padding: 5px 0;
      cursor: default;
      user-select: none;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-cat:hover { color: var(--text-mid); }

    .nav-cat .arrow {
      font-size: 10px;
      color: var(--text-dim);
      display: inline-block;
      margin-left: 5px;
    }

    .nav-sub {
      display: flex;
      flex-direction: column;
      padding-left: 8px;
      margin-bottom: 4px;
      align-items: flex-start;
    }

    .nav-sub a {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-mid);
      text-decoration: none;
      padding: 4px 0;
      letter-spacing: .04em;
      transition: color .15s;
    }
    .nav-sub a:hover { color: var(--text); }

    .nav-sep {
      height: 0.5px;
      background: var(--border);
      margin: 20px 0;
    }

    .nav-link {
      display: block;
      font-family: var(--font);
      font-size: 15px;
      color: var(--text);
      text-decoration: none;
      padding: 5px 0;
      letter-spacing: .04em;
      transition: color .15s;
    }
    .nav-link:hover { color: var(--text-mid); }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 20px;
    }
    .sidebar-bottom a {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      text-decoration: none;
      padding: 3px 0;
      letter-spacing: .06em;
      transition: color .15s;
    }
    .sidebar-bottom a:hover { color: var(--text); }

    /* ══════════════════════════════════
       MODAL YOUTUBE
    ══════════════════════════════════ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    .modal-inner {
      position: relative;
      width: 90vw;
      max-width: 1100px;
    }

    .modal-video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #000;
    }
    .modal-video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-close {
      position: absolute;
      top: -36px;
      right: 0;
      background: none;
      border: none;
      color: rgba(255,255,255,.55);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .12em;
      cursor: pointer;
      padding: 4px 0;
      transition: color .15s;
    }
    .modal-close:hover { color: #fff; }

    /* ══════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════ */
    @media (max-width: 900px) {
      .mosaic {
        grid-template-columns: repeat(8, 1fr);
        grid-auto-rows: 55px;
      }
      .tile.showreel { grid-column: 1 / 6;  grid-row: 1 / 5;  }
      .tile.t2       { grid-column: 6 / 9;  grid-row: 1 / 5;  }
      .tile.t3       { grid-column: 1 / 5;  grid-row: 5 / 8;  }
      .tile.t4       { grid-column: 5 / 7;  grid-row: 5 / 10; }
      .tile.t5       { grid-column: 7 / 9;  grid-row: 5 / 8;  }
      .tile.t6       { grid-column: 7 / 9;  grid-row: 8 / 10; }
      .tile.t7       { grid-column: 1 / 5;  grid-row: 8 / 10; }
      .tile.t8       { grid-column: 1 / 3;  grid-row: 10 / 14;}
      .tile.t9       { grid-column: 3 / 9;  grid-row: 10 / 14;}
    }
    @media (max-width: 600px) {
      body { flex-direction: column; }
      .mosaic-wrap { margin-right: 0; padding: 14px 10px 80px; }
      .mosaic {
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 60px;
      }
      .tile.showreel { grid-column: 1 / 5; grid-row: 1 / 4;  }
      .tile.t2       { grid-column: 1 / 3; grid-row: 4 / 7;  }
      .tile.t3       { grid-column: 3 / 5; grid-row: 4 / 6;  }
      .tile.t4       { grid-column: 3 / 5; grid-row: 6 / 9;  }
      .tile.t5       { grid-column: 1 / 3; grid-row: 7 / 9;  }
      .tile.t6       { grid-column: 1 / 3; grid-row: 9 / 12; }
      .tile.t7       { grid-column: 3 / 5; grid-row: 9 / 11; }
      .tile.t8       { grid-column: 3 / 5; grid-row: 11 / 14;}
      .tile.t9       { grid-column: 1 / 3; grid-row: 12 / 14;}
      .sidebar {
        position: fixed;
        top: auto; bottom: 0;
        right: 0; left: 0;
        width: 100%;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        padding: 12px 16px;
        border-top: 0.5px solid var(--border);
        overflow: visible;
      }
      .logo-wrap { margin-bottom: 0; margin-right: auto; }
      .logo-wrap img { max-width: 80px; }
      .nav-section, .nav-sep, .sidebar-bottom { display: none; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════
     MOSAÏQUE
══════════════════════════════════ -->
<div class="mosaic-wrap">
  <div class="mosaic" id="mosaic">

    <!--
      ════════════════════════════════════════════════════
      GUIDE — comment modifier chaque tile
      ════════════════════════════════════════════════════

      SHOWREEL (video1.mp4) :
        Remplacez src="video1.mp4" par votre fichier.
        Autoplay muet en boucle, pas de clic.

      TILES t2 → t9 :
        data-yt="VOTRE_ID_YOUTUBE"
          → L'identifiant YouTube (ex: dQw4w9WgXcQ dans youtube.com/watch?v=dQw4w9WgXcQ)
          → Clic ouvre le lecteur YouTube en modal 16:9
          → Laissez data-yt="" pour désactiver le clic

        <img class="tile-media" src="imageN.jpg" alt="" />
          → Remplacez imageN.jpg par votre vignette (image1.jpg, image2.jpg…)
          → Ou utilisez une vidéo en fond :
             <video class="tile-media" src="fichier.mp4" muted loop playsinline></video>
      ════════════════════════════════════════════════════
    -->

    <!-- ── SHOWREEL — autoplay muet, pas de clic ── -->
    <div class="tile showreel">
      <video
        class="tile-media"
        src="video1.mp4"
        autoplay muted loop playsinline
        id="showreel-bg"
      ></video>
    </div>

    <!-- ── TILE 2 — remplacez YOUTUBE_ID_ICI et image2.jpg ── -->
    <div class="tile t2" data-yt="YOUTUBE_ID_ICI">
      <img class="tile-media" src="image2.jpg" alt="" />
      <div class="tile-overlay"><div class="play-icon"></div></div>
    </div>

    <!-- ── TILE 3 ── -->
    <div class="tile t3" data-yt="YOUTUBE_ID_ICI">
      <img class="tile-media" src="image3.jpg" alt="" />
      <div class="tile-overlay"><div class="play-icon"></div></div>
    </div>

    <!-- ── TILE 4 ── -->
    <div class="tile t4" data-yt="YOUTUBE_ID_ICI">
      <img class="tile-media" src="image4.jpg" alt="" />
      <div class="tile-overlay"><div class="play-icon"></div></div>
    </div>

    <!-- ── TILE 5 ── -->
    <div class="tile t5" data-yt="YOUTUBE_ID_ICI">
      <img class="tile-media" src="image5.jpg" alt="" />
      <div class="tile-overlay"><div class="play-icon"></div></div>
    </div>

    <!-- ── TILE 6 ── -->
    <div class="tile t6" data-yt="YOUTUBE_ID_ICI">
      <img class="tile-media" src="image6.jpg" alt="" />
      <div class="tile-overlay"><div class="play-icon"></div></div>
    </div>

    <!-- ── TILE 7 ── -->
    <div class="tile t7" data-yt="YOUTUBE_ID_ICI">
      <img class="tile-media" src="image7.jpg" alt="" />
      <div class="tile-overlay"><div class="play-icon"></div></div>
    </div>

    <!-- ── TILE 8 ── -->
    <div class="tile t8" data-yt="YOUTUBE_ID_ICI">
      <img class="tile-media" src="image8.jpg" alt="" />
      <div class="tile-overlay"><div class="play-icon"></div></div>
    </div>

    <!-- ── TILE 9 ── -->
    <div class="tile t9" data-yt="YOUTUBE_ID_ICI">
      <img class="tile-media" src="image9.jpg" alt="" />
      <div class="tile-overlay"><div class="play-icon"></div></div>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════
     MODAL YOUTUBE
══════════════════════════════════ -->
<div class="modal-backdrop" id="modal" onclick="handleBackdropClick(event)">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModal()">✕ FERMER</button>
    <div class="modal-video-wrap" id="modal-video-wrap"></div>
  </div>
</div>

<script>
  const modal     = document.getElementById('modal');
  const modalWrap = document.getElementById('modal-video-wrap');
  const showreel  = document.getElementById('showreel-bg');

  function openYT(ytId) {
    modalWrap.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
    iframe.allow = 'autoplay; fullscreen';
    iframe.allowFullscreen = true;
    modalWrap.appendChild(iframe);
    modal.classList.add('open');
    if (showreel) showreel.pause();
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.remove('open');
    modalWrap.innerHTML = '';
    if (showreel) showreel.play();
    document.body.style.overflow = '';
  }

  function handleBackdropClick(e) {
    if (e.target === modal) closeModal();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  document.querySelectorAll('.tile[data-yt]').forEach(tile => {
    tile.addEventListener('click', () => {
      const ytId = tile.dataset.yt;
      if (ytId && ytId !== 'YOUTUBE_ID_ICI') openYT(ytId);
    });
  });
</script>
